# S20 远程控制 - nginx 反向代理样例（TLS 终止在 nginx，relay_server.py 跑明文）
#
# 部署：
#   1) 证书：用 acme.sh / certbot 为该域名签发（DNS-01 或 HTTP-01）
#   2) relay_server.py 只监听内网：RELAY_HOST=127.0.0.1 RELAY_PORT=9000
#   3) cp 本文件到 /etc/nginx/conf.d/s20.conf 后 nginx -t && nginx -s reload
#   4) 手机端 Config.relayUrl 填 wss://<域名>/ws
#
# 关键点：
#   - /ws 必须透传 Upgrade/Connection，否则 WebSocket 握手失败
#   - proxy_read_timeout 必须大于心跳间隔（默认 60s），否则长连被掐断
#   - X-Forwarded-Proto 让服务端知道外部是 https（决定 Set-Cookie 是否带 Secure）

upstream s20_relay {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name s20.example.com;

    # 可选：强制跳 https（如只用 wss 可保留）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s20.example.com;

    ssl_certificate     /etc/nginx/certs/s20.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/s20.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 512m;   # 文件上传通道

    # WebSocket（手机端 / 控制端）
    location /ws {
        proxy_pass http://s20_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # HTTP API + 控制台
    location / {
        proxy_pass http://s20_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
