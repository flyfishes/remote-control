plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.s20.remote'
    compileSdk 33
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.s20.remote"
        // 23 = Android 6.0（乐视 1 Pro）；S20 侧语义不变
        minSdk 23
        targetSdk 33
        versionCode 19
        versionName "1.3.0"
    }

    lint {
        // 兼容低版本设备时允许少量新 API 警告（均已有运行时版本保护）
        abortOnError false
    }

    signingConfigs {
        debug {
            storeFile file('keystore.jks')
            storePassword 's20remote'
            keyAlias 'remote'
            keyPassword 's20remote'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // BouncyCastle 多 jar 都有该清单，重复会 merge 失败
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/9/module-info.class',
                'META-INF/versions/**/module-info.class'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // 自签证书生成（TlsManager）：Android 自带 BC 为裁剪版，需独立引入
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
